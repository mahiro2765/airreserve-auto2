name: booking-run

on:
  schedule:
    - cron: "55 14 * * 1"  # 火曜0:00 JSTの5分前（UTC 14:55）

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: node booking.js
