name: Auto Reserve

on:
  schedule:
    - cron: '0 15 * * 1'

  workflow_dispatch:

jobs:
  reserve:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install --with-deps

      - name: Run Booking
        env:
          RECRUIT_ID: ${{ secrets.RECRUIT_ID }}
          RECRUIT_PASSWORD: ${{ secrets.RECRUIT_PASSWORD }}
        run: node booking.js
